<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Journey Through Space and Time</title>
<style>
:root{
  --ink: #e0e7ff; 
  --ink-dim: #a5b4fc;
  --card-bg: rgba(15, 23, 42, 0.65);
  --card-border: rgba(255, 255, 255, 0.12);
  --accent: #c084fc; 
  --accent-glow: rgba(192, 132, 252, 0.4);
  --shadow: 0 12px 40px rgba(0,0,0,0.6);
}
html, body { height:100%; } * { box-sizing:border-box; }

body{
  margin:0; font-family:"Georgia",serif; color:var(--ink);
  background-color: #030512;
  /* Default background, will be overridden by JS */
  background-image: linear-gradient(180deg, #020410 0%, #0f172a 100%);
  background-size: 200% 200%;
  transition: background-image 1.5s ease-in-out, background-color 1.5s ease;
  overflow-x:hidden;
}

/* Night sky container */
#sky{ position:fixed; inset:0; pointer-events:none; z-index:0; }

/* Stars */
.star{ 
  position:absolute; border-radius:50%; 
  box-shadow:0 0 4px rgba(255,255,255,0.8); 
  animation:flicker infinite ease-in-out;
}
@keyframes flicker {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px currentColor; }
}

/* The Moon */
.moon{
  position:fixed; right:5vw; top:5vh; width:100px; height:100px; z-index:1; border-radius:50%;
  background: radial-gradient(circle at 35% 35%, #fff 0%, #e0e7ff 40%, #94a3b8 100%);
  box-shadow: 0 0 40px rgba(192, 132, 252, 0.3), 0 0 80px rgba(255,255,255,0.1);
  transition: box-shadow 1.5s ease;
}

/* Main Reader Card */
.container{
  position:relative; z-index:2; max-width:960px; 
  background: var(--card-bg);
  margin:56px auto; padding:32px 28px; border-radius:24px;
  border:1px solid var(--card-border); 
  box-shadow:var(--shadow); 
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.header{ text-align:center; margin-bottom:24px; }
h1{ margin:0; font-size:2rem; font-weight:700; color:#fff; text-shadow:0 2px 10px rgba(255, 255, 255, 0.3); transition: color 0.5s ease;}
.subtitle{ margin:6px 0 0; font-size:1rem; color:var(--ink-dim); letter-spacing:1px; }

/* Audio Player */
audio{ display:block; margin:20px auto; width:100%; max-width:720px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); accent-color:var(--accent); }

/* Error banner */
#err{
  display:none; margin:8px auto 14px; max-width:720px; padding:10px 12px;
  border-radius:10px; border:1px solid rgba(248, 113, 113, 0.4);
  background:rgba(239, 68, 68, 0.15); color:#fca5a5; font-size:.95rem; text-align:center;
}

/* Carousel */
.carousel{ position:relative; margin:24px auto 0; max-width:860px; overflow:hidden;
  border-radius:16px; border:1px solid var(--card-border); 
  background: rgba(0,0,0,0.2); }
.track{ display:flex; transition: transform .5s cubic-bezier(.22,.61,.36,1); will-change: transform; }

.slide{ 
  min-width:100%; padding:40px 24px; 
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  text-align:center;
}
.slide h2{ font-size:1.6rem; margin:0; color:#fff; }
.slide p{ font-size:1.1rem; color:var(--ink-dim); margin:0; max-width:600px; line-height:1.5; }

/* Controls */
.controls{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin:24px auto 0; max-width:860px; }
.btn{
  appearance:none; border:1px solid var(--card-border); cursor:pointer; padding:12px 20px; border-radius:14px;
  background: rgba(255,255,255,0.08);
  color:#fff; font-size:1rem; font-weight:600;
  transition: all 0.2s ease;
}
.btn:hover:not(:disabled){ background: rgba(255,255,255,0.15); border-color:var(--accent-glow); transform:translateY(-1px); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }

.dots{ display:flex; gap:10px; align-items:center; justify-content:center; flex:1; }
.dot{
  width:10px; height:10px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.2); cursor:pointer; transition:all 0.3s ease;
}
.dot[aria-selected="true"]{ 
  background:var(--accent); 
  box-shadow:0 0 12px var(--accent); 
  transform:scale(1.3); 
}

.footer{ margin-top:20px; text-align:center; font-size:.85rem; color:rgba(255,255,255,0.4); }

@media (max-width: 600px){
  h1{ font-size:1.5rem; }
  .moon{ width:60px; height:60px; top:3vh; right:5vw; }
  .container{ margin:20px 12px; padding:24px 16px; }
  .btn{ padding:10px 14px; font-size:0.9rem; }
}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>

<div class="container" id="reader" role="region" aria-label="Bedtime story reader">
  <div class="header">
    <h1 id="titleText">🚀 Part 1 — The Moonlit Path</h1>
    <p class="subtitle" id="subtitleText">Press play to start your journey.</p>
  </div>

  <audio id="audio" controls preload="metadata" playsinline></audio>
  <div id="err" role="alert"></div>

  <div class="carousel" id="carousel" aria-roledescription="carousel">
    <div class="track" id="track" role="group" aria-label="Story parts"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" aria-label="Previous part">Previous</button>
    <div class="dots" id="dots" role="tablist" aria-label="Select part"></div>
    <button class="btn" id="nextBtn" aria-label="Next part">Next</button>
  </div>
  
  <div class="footer">Navigate through the galaxy of stories.</div>
</div>

<script>
/* ——— Config ——— */
const AUDIO_BASE = "./Stories/"; 

/* Each part now has a 'bg' property for its unique galaxy background */
const PARTS = [
  { 
    title: "🌙 Part 1 — A thread to the Edge of Space",  
    file: "part1.mp3", 
    blurb: "Separated Through Space",
    bg: `radial-gradient(circle at 10% 20%, rgba(76, 29, 149, 0.4) 0%, transparent 40%), 
         radial-gradient(circle at 90% 80%, rgba(219, 39, 119, 0.25) 0%, transparent 40%),
         radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
         linear-gradient(180deg, #020410 0%, #0f172a 100%)`
  },
  // { 
  //   title: "🌌 Part 2 — A Thread of Hope",    
  //   file: "part2.mp3", 
  //   blurb: "Mysteries woven in the crimson void.",
  //   bg: `radial-gradient(circle at 50% 10%, rgba(220, 38, 38, 0.2) 0%, transparent 60%),
  //        radial-gradient(circle at 50% 90%, rgba(147, 51, 234, 0.25) 0%, transparent 60%),
  //        linear-gradient(180deg, #1a0000 0%, #1e1b4b 100%)`
  // },
  // { 
  //   title: "💤 Part 3 — Connected Till the End",      
  //   file: "part3.mp3", 
  //   blurb: "A peaceful drift into the blue infinity.",
  //   bg: `radial-gradient(circle at 50% 50%, rgba(253, 224, 71, 0.1) 0%, transparent 70%),
  //        radial-gradient(circle at 100% 0%, rgba(192, 132, 252, 0.2) 0%, transparent 60%),
  //        linear-gradient(180deg, #020617 0%, #172554 100%)`
  // },
];

/* ——— Space & Stars Logic ——— */
(function createGalaxy(){
  const sky = document.getElementById('sky');
  const STAR_COUNT = 200;
  
  // Star colors: White, Light Blue, Soft Pink, Warm Yellow
  const colors = ['#ffffff', '#c4f0ff', '#fbcfe8', '#fef08a'];

  for(let i=0; i<STAR_COUNT; i++){
    const s = document.createElement('div');
    s.className = 'star';
    
    // Random position
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    s.style.left = x + 'vw';
    s.style.top  = y + 'vh';
    
    // Random size
    const size = Math.random() * 2.5 + 1; 
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    
    // Random color
    const color = colors[Math.floor(Math.random() * colors.length)];
    s.style.backgroundColor = color;
    s.style.color = color; // for box-shadow

    // Random animation timing
    const duration = Math.random() * 3 + 2; 
    const delay = Math.random() * 5;
    s.style.animationDuration = duration + 's';
    s.style.animationDelay = delay + 's';
    
    sky.appendChild(s);
  }
})();

/* ——— App Logic ——— */
const track = document.getElementById('track');
const dots  = document.getElementById('dots');
const audio = document.getElementById('audio');
const errEl = document.getElementById('err');
const titleEl = document.getElementById('titleText');
const subtitleEl = document.getElementById('subtitleText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let index = 0;

/* Build slides/dots */
PARTS.forEach((p, i)=>{
  const slide = document.createElement('section');
  slide.className = 'slide';
  slide.setAttribute('aria-roledescription','slide');
  slide.setAttribute('aria-label', `Part ${i+1}`);
  slide.innerHTML = `<h2>${p.title}</h2><p>${p.blurb}</p>`;
  track.appendChild(slide);

  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.setAttribute('role','tab');
  dot.setAttribute('aria-label', `Go to ${p.title}`);
  dot.addEventListener('click', ()=> goTo(i, true));
  dots.appendChild(dot);
});

/* Error helpers */
function showError(msg){
  errEl.style.display = 'block';
  errEl.textContent = msg;
}
function clearError(){
  errEl.style.display = 'none';
  errEl.textContent = '';
}

/* Load Audio */
function loadAudioFor(part){
  clearError();
  audio.pause();
  audio.currentTime = 0;
  audio.removeAttribute('src');
  while (audio.firstChild) audio.removeChild(audio.firstChild);

  const full = AUDIO_BASE + part.file;
  const source = document.createElement('source');
  source.src = full;
  source.type = 'audio/mpeg';
  audio.appendChild(source);
  audio.load();
}

/* Navigation */
function goTo(i, fromClick=false){
  const wasPlaying = !audio.paused && !audio.ended;
  index = Math.max(0, Math.min(PARTS.length-1, i));
  track.style.transform = `translateX(${-index*100}%)`;

  Array.from(dots.children).forEach((d, di)=> d.setAttribute('aria-selected', di===index ? 'true':'false'));

  const part = PARTS[index];
  
  // 1. Update Text
  titleEl.textContent = part.title;
  subtitleEl.textContent = "Drift into the stars.";
  
  // 2. Update Background (The magic part!)
  document.body.style.backgroundImage = part.bg;

  // 3. Load Audio
  loadAudioFor(part);

  // 4. Update Buttons
  prevBtn.disabled = (index===0);
  nextBtn.disabled = (index===PARTS.length-1);

  if (fromClick || wasPlaying) {
    audio.play().catch(()=>{});
  }
}

/* Listeners */
prevBtn.addEventListener('click', ()=> goTo(index-1, true));
nextBtn.addEventListener('click', ()=> goTo(index+1, true));
document.addEventListener('keydown', (e)=>{
  if (e.key === 'ArrowLeft') goTo(index-1, true);
  if (e.key === 'ArrowRight') goTo(index+1, true);
});

/* Swipe Logic */
let startX=null;
track.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
track.addEventListener('touchmove',  e=>{
  if (startX===null) return;
  const dx = e.touches[0].clientX - startX;
  if (Math.abs(dx) > 40){
    goTo(index + (dx<0?1:-1), true);
    startX = null;
  }
}, {passive:true});
track.addEventListener('touchend', ()=>{ startX=null; });

/* Audio Error Handling */
audio.addEventListener('error', ()=>{
  const err = audio.error;
  let msg = "Audio failed to load.";
  if (err && err.code === 4) msg += " File format not supported or file missing.";
  showError(msg);
});
audio.addEventListener('stalled', ()=> showError("Audio stalled. Check connection."));
audio.addEventListener('canplay', clearError);

/* Initialize */
goTo(0);
</script>
</body>
</html>
